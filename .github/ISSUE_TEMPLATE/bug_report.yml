name: Bug report
description: The line shows something wrong, shows nothing, or prints an error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste a token, a `.credentials.json` or anything from your keychain here. A security problem goes through [SECURITY.md](https://github.com/dima-gusyatiner/budget-statusline/blob/main/SECURITY.md) instead.
  - type: textarea
    id: shows
    attributes:
      label: What the line shows
      description: Copy the line as text. Add a screenshot if symbols look wrong or colours seem off.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
      placeholder: 2.1.303 (Claude Code)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: budget-statusline version
      description: Shown by `claude plugin list`, or the commit you installed from.
      placeholder: 1.0.1
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - The plugin
        - install.sh
        - By hand
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 26.6, Ubuntu 24.04, Windows 11 with Git Bash
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and font
      placeholder: Ghostty 1.3 with JetBrains Mono
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Account type
      options:
        - Claude Pro or Max
        - Claude Pro or Max, spending usage credits
        - Enterprise, usage-based seat
        - Team or Enterprise, another kind of seat
        - Claude apps gateway with a spend limit
        - API key, Amazon Bedrock or Google Vertex AI
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The last lines of the plugin log
      description: |
        The output of `tail -n 20 ~/.claude/.budget-statusline.log`, or the same file in `$CLAUDE_CONFIG_DIR` if you set it. Skip this if you did not install the plugin.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Your `statusLine` command, any `CC_*` settings or `padding`, and what you already tried.
